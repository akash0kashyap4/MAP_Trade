<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>MAP Trade — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #050508;
      --bg2:       #0a0a12;
      --text:      #e8e8e0;
      --text-dim:  #6b6b80;
      --cyan:      #00d4ff;
      --teal:      #00ffcc;
      --amber:     #ffaa00;
      --red:       #ff3355;
      --grid:      #1a1a2e;
      --mono:      'IBM Plex Mono', monospace;
      --label:     'Barlow Condensed', sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }

    /* ── Ambient background ── */
    .bg-grid {
      position: fixed; inset: 0;
      background:
        linear-gradient(rgba(0,212,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 30%, transparent 100%);
      animation: gridDrift 30s linear infinite;
      pointer-events: none;
    }
    @keyframes gridDrift {
      from { background-position: 0 0; }
      to   { background-position: 44px 44px; }
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .16;
      pointer-events: none;
      animation: orbFloat 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 480px; height: 480px; background: #0090c0; top: -140px; left: -120px; }
    .orb-2 { width: 420px; height: 420px; background: #007a66; bottom: -160px; right: -100px; animation-delay: -7s; }
    @keyframes orbFloat {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(160deg, rgba(14,16,28,.92), rgba(8,9,16,.94));
      border: 1px solid rgba(0,212,255,.18);
      border-radius: 16px;
      padding: 44px 40px 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 24px 80px rgba(0,0,0,.6),
        0 0 60px rgba(0,212,255,.07),
        inset 0 1px 0 rgba(255,255,255,.05);
      animation: cardIn .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    /* Top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 32px; right: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: .8;
    }

    /* ── Branding ── */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .brand-mark {
      width: 42px; height: 42px;
      border-radius: 11px;
      background: linear-gradient(140deg, rgba(0,212,255,.16), rgba(0,255,204,.08));
      border: 1px solid rgba(0,212,255,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 22px rgba(0,212,255,.18);
    }
    .brand-name {
      font-family: var(--label);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--cyan);
      text-shadow: 0 0 24px rgba(0,212,255,.45);
    }
    .brand-name span { color: var(--text); }
    .subtitle {
      font-family: var(--label);
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 34px;
    }
    .subtitle b {
      color: var(--teal);
      font-weight: 500;
    }

    /* ── Form ── */
    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-family: var(--label);
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      background: rgba(0,212,255,.04);
      border: 1px solid rgba(0,212,255,.16);
      border-radius: 10px;
      color: var(--text);
      caret-color: var(--cyan);
      font-family: var(--mono);
      font-size: 15px;
      padding: 13px 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: rgba(107,107,128,.55); }
    input:hover { border-color: rgba(0,212,255,.32); }
    input:focus-visible {
      border-color: rgba(0,212,255,.75);
      background: rgba(0,212,255,.06);
      box-shadow: 0 0 0 3px rgba(0,212,255,.14);
    }
    input#pwd { padding-right: 64px; }

    .pwd-toggle {
      position: absolute;
      top: 50%; right: 8px;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--label);
      font-size: 11px;
      letter-spacing: 2px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: color .15s;
    }
    .pwd-toggle:hover, .pwd-toggle:focus-visible { color: var(--cyan); outline: none; }
    .pwd-toggle:focus-visible { box-shadow: 0 0 0 2px rgba(0,212,255,.35); }

    /* ── Submit ── */
    .submit {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      border: none;
      border-radius: 10px;
      font-family: var(--label);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #02060a;
      cursor: pointer;
      transition: box-shadow .2s, transform .12s, opacity .2s;
      box-shadow: 0 6px 28px rgba(0,212,255,.28);
    }
    .submit:hover  { box-shadow: 0 8px 36px rgba(0,212,255,.45); }
    .submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,212,255,.5), 0 6px 28px rgba(0,212,255,.28); }
    .submit:active { transform: scale(.985); }
    .submit:disabled { opacity: .6; cursor: wait; transform: none; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(2,6,10,.35);
      border-top-color: #02060a;
      border-radius: 50%;
      vertical-align: -2px;
      margin-right: 8px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--red);
      font-size: 12px;
      letter-spacing: .5px;
      text-align: center;
      margin-top: 16px;
      min-height: 18px;
    }
    .error.shake { animation: shake .35s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }

    /* ── Footer ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(0,212,255,.1);
      margin: 26px 0 18px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--label);
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .lock-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px rgba(0,255,204,.7);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%     { opacity: .35; }
    }

    /* ── Small screens ── */
    @media (max-width: 460px) {
      .card { padding: 34px 24px 28px; border-radius: 14px; }
      .brand-name { font-size: 26px; letter-spacing: 4px; }
    }

    /* Respect users who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <main class="card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">⚡</div>
      <h1 class="brand-name">MAP<span>·TRADE</span></h1>
    </div>
    <p class="subtitle">AI Trading Terminal — <b>Secure Access</b></p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="uid">User ID</label>
        <input id="uid" name="username" type="text" placeholder="Enter user ID"
               autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      </div>

      <div class="field">
        <label for="pwd">Password</label>
        <div class="input-wrap">
          <input id="pwd" name="password" type="password" placeholder="Enter password"
                 autocomplete="current-password" required />
          <button type="button" class="pwd-toggle" id="pwdToggle"
                  aria-label="Show password" aria-pressed="false">SHOW</button>
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">ACCESS DASHBOARD</button>
      <div class="error" id="errMsg" role="alert" aria-live="assertive"></div>
    </form>

    <hr class="divider">
    <div class="footer"><span class="lock-dot" aria-hidden="true"></span> Encrypted session · Authorized personnel only</div>
  </main>

  <script>
    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errEl     = document.getElementById('errMsg');
    const pwdInput  = document.getElementById('pwd');
    const pwdToggle = document.getElementById('pwdToggle');

    pwdToggle.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      pwdToggle.textContent = show ? 'HIDE' : 'SHOW';
      pwdToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      pwdToggle.setAttribute('aria-pressed', String(show));
      pwdInput.focus();
    });

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('shake');
      // restart the shake animation
      void errEl.offsetWidth;
      errEl.classList.add('shake');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const uid = document.getElementById('uid').value.trim();
      const pwd = pwdInput.value;
      errEl.textContent = '';

      if (!uid || !pwd) {
        showError('Enter both user ID and password');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>VERIFYING…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: uid, password: pwd }),
          credentials: 'include'
        });
        if (res.ok) {
          submitBtn.innerHTML = 'ACCESS GRANTED ✓';
          window.location.href = '/dashboard';
          return;
        }
        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'ACCESS DENIED — Invalid credentials');
      } catch {
        showError('CONNECTION ERROR — Try again');
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'ACCESS DASHBOARD';
    });
  </script>
</body>
</html>
